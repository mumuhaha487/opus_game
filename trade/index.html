<!DOCTYPE html>
<!-- 模拟交易所单页入口，复用全站 GameAccount 会话。
     DESIGN §4、§6：常驻视图外壳，行情直连 Gate.io、腾讯和东方财富。
     Lightweight Charts 原样 vendored，全部动态 DOM 由模块安全写入。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D11">
  <title>模拟交易所 · GAME.INC.RE</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/trade.css">
  <link rel="stylesheet" href="../hub/keys-ui.css">
</head>
<body>
  <aside class="rail">
    <a class="trade-brand" href="/" title="返回主页">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <path fill="#F2C66D" d="M12 1 23 12 12 23 1 12Z"/>
        <path fill="#13161C" d="M12 6 18 12 12 18 6 12Z"/>
        <path fill="#F2C66D" d="M12 9.5 14.5 12 12 14.5 9.5 12Z"/>
      </svg>
    </a>
    <nav class="desktop-nav" aria-label="交易所" id="desktop-nav"></nav>
    <i class="rail-indicator" id="rail-indicator"></i>
    <div class="rail-bottom" id="rail-actions"></div>
  </aside>
  <header class="trade-header top" id="header">
    <a class="home-link" href="/" title="回到 GAME.INC.RE 主页" aria-label="返回主页">
      <span class="home-text"><i>‹</i> GAME.INC.RE</span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"
        aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg>
    </a><i class="home-divider" aria-hidden="true"></i>
    <span id="page-title">总览</span>
    <div class="global-search">
      <input id="global-search" placeholder="搜索股票或币种：代码 / 名称 / 拼音" aria-label="搜索股票或币种">
      <kbd>/</kbd><div id="search-results" hidden></div>
    </div>
    <div class="header-actions" id="header-actions"></div>
  </header>
  <main>
    <section id="overview-page" class="overview-page" aria-label="总览" hidden></section>
    <section id="ashare-page" class="ashare-page cn-market" aria-label="A股行情" hidden></section>
    <div class="desk trade" id="desk" hidden>
      <section class="panel bar" id="bar" aria-label="交易对"></section>
      <section class="panel book" id="book" aria-label="订单簿"></section>
      <section class="panel chart" id="chart" aria-label="K 线"></section>
      <section class="panel form" id="form" aria-label="下单">
        <div id="spot-form"></div>
        <div id="futures-form" hidden></div>
      </section>
      <div class="aux" id="aux">
        <div class="aux-tabs" id="aux-tabs"></div>
        <section class="panel side" id="side" aria-label="市场列表"></section>
        <section class="panel tape" id="tape" aria-label="最新成交"></section>
      </div>
      <section class="panel orders" id="orders" aria-label="委托与资产"></section>
    </div>
    <div id="stock-page" class="trade cn-market" aria-label="A股交易" hidden></div>
    <section class="panel market-page" id="markets-page" aria-label="行情" hidden></section>
    <section class="panel assets-page" id="assets-page" aria-label="资产" hidden></section>
  </main>
  <footer class="trade-footer">
    <div><i class="connection-dot" id="connection-dot"></i><span id="connection-status">行情重连中…</span>
      · <span id="feed-source">数据来源 Gate.io</span></div>
    <div>仅教学练习 · 不构成投资建议 · 模拟资产不可兑现</div>
  </footer>
  <nav class="mobile-nav" aria-label="交易所" id="mobile-nav"></nav>
  <div class="chart-mobile-actions" id="chart-mobile-actions"></div>
  <dialog id="modal" class="trade-modal" aria-label="账号与资产操作"><div id="modal-content"></div></dialog>
  <div id="toasts" role="status" aria-live="polite"></div>
  <script src="../hub/account-core.js"></script>
  <script src="js/markets.js"></script>
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
